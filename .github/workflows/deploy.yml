name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://sgkaybgsuvgjhddmjkct.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_n1JVhD8C3QSfxFCuLNhnbw_cg0dTF1c"
          NEXT_PUBLIC_AI_API_KEY: "tp-s46ldmyfvx40j4nyc0r9527n1vra3klr4psjtwo69z2of65b"
          NEXT_PUBLIC_AI_BASE_URL: "https://token-plan-sgp.xiaomimimo.com/v1"
          NEXT_PUBLIC_AI_MODEL: "mimo-v2.5-pro"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - uses: actions/deploy-pages@v4
